[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Allow environment variables
clear_env = no

; Pass environment variables
env[DB_HOST] = mariadb
env[DB_NAME] = zoemkinderopvang
env[DB_USER] = zoem
env[DB_PASSWORD] = zoem_secret
env[APP_URL] = http://localhost:8080
env[APP_ENV] = development